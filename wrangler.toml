# Cloudflare Pages 配置文件
# 文档: https://developers.cloudflare.com/pages/

name = "fifa-worldcup-analytics"
compatibility_date = "2024-01-01"

# 纯静态站点，无需构建命令
pages_build_output_dir = "."

# 环境变量（如果有需要可在此定义）
[vars]
SITE_TITLE = "FIFA World Cup Analytics"

# 开发服务器配置（可选）
[dev]
port = 8080

# ── Pages Functions KV 绑定 ──
[[kv_namespaces]]
binding = "ACTIVATION_CODES"
id = "7993ff95b247423fa1a960c79279ad09"
